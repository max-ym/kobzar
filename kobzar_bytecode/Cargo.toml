[package]
name = "kobzar_bytecode"
version = "0.1.0"
edition = "2024"
authors = ["Maxym Naumchyk <max.naumch@gmail.com>"]

[lib]
crate-type = ["cdylib"]

[dependencies]
smallvec = { version = "1.15", features = ["union"] }
compact_str = "0.9"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
ahash = "0.8"
hashbrown = "0.15"
